name        = "transfer.pay"
version     = "0.1.0"
description = "Sends a direct payment to a Hedera account on the configured network (testnet by default): HBAR by default, or an HTS fungible token (e.g. USDC) when token_id is provided. Use this when you need to pay a known Hedera account ID directly — not for paywalled URLs, use pay.x402 for those."
triggers = []

[display]
action = "Sending {amount} to {recipient}"

[capabilities]
hedera_pay = true

[call]
args_schema   = '{"recipient":"<required — Hedera AccountId, e.g. 0.0.1234>","amount":"<required — HBAR amount as a number, e.g. 1.5; or human token units when token_id is set>","memo":"<optional — transaction memo, defaults to empty>","token_id":"<optional — HTS token id to pay in, e.g. USDC token id. Omit or 0.0.0 for HBAR>"}'
output_schema = '{"transaction_id":"string","hashscan_url":"string","status":"string"}'

[call.parameters]
type = "object"

[call.parameters.properties.recipient]
type = "string"
description = "The Hedera AccountId to send to, e.g. 0.0.1234. Required — this skill has no default recipient."

[call.parameters.properties.amount]
type = "number"
description = "Amount to send, e.g. 1.5. HBAR when token_id is omitted, otherwise human units of the token (e.g. 1.5 USDC). Required — this skill has no default amount."

[call.parameters.properties.token_id]
type = "string"
description = "Optional HTS token id to pay in (e.g. USDC). Omit or 0.0.0 for HBAR."

[call.parameters.properties.memo]
type = "string"
description = "Optional memo to attach to the transfer transaction."

[react]
max_steps = 2