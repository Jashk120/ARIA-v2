name        = "write.docx"
version     = "0.1.0"
description = "Generate a Word (.docx) document from a title, paragraphs, and one table of cell rows"

triggers = []

[display]
action = "Writing Word document {path}"

[capabilities]
fs = true

[call]
args_schema   = '{"path":"string","title":"string","paragraphs":["string"],"table":[["string"]]}'
output_schema = '{"path":"string","bytes_written":"number","paragraphs":"number","table_rows":"number"}'

[call.parameters]
type = "object"

[call.parameters.properties.path]
type = "string"
description = "Path of the .docx file to create on the local filesystem (relative to fs_root or absolute)"

[call.parameters.properties.title]
type = "string"
description = "Document title rendered as a Heading1 paragraph at the top (default: empty)"

[call.parameters.properties.paragraphs]
type = "array"
description = "Body paragraphs as plain strings, in order (default: empty)"

[call.parameters.properties.table]
type = "array"
description = "One table; each row is an array of cell values (default: empty)"

[react]
max_steps = 1

[config.fs_root]
default = "~/aria-workspace"
inject  = true

[config.fs_mode]
default = "whitelist"
inject  = true

[config.fs_allow]
default = "*"
inject  = true

[config.fs_deny]
default = ""
inject  = true
