name        = "read.fs"
version     = "0.1.0"
description = "Read the contents of a text file from the local filesystem"

triggers = []

[display]
action = "Reading {path}"

[capabilities]
fs = true

[call]
args_schema   = '{"path":"string","max_chars":4000}'
output_schema = '{"path":"string","text":"string","chars":"number","truncated":"bool"}'

[call.parameters]
type = "object"

[call.parameters.properties.path]
type = "string"
description = "Path to the text file to read on the local filesystem"

[call.parameters.properties.max_chars]
type = "integer"
description = "Maximum number of characters to read (default: 4000)"

[react]
max_steps = 3

[config.fs_root]
default = "~/"
inject  = true

[config.fs_mode]
default = "whitelist"
inject  = true

[config.fs_allow]
default = "*"
inject  = true

[config.fs_deny]
default = ""
inject  = true
