name        = "x402.pay"
version     = "0.1.0"
description = "Fetches a URL, paying automatically via Hedera x402 if the server returns HTTP 402 Payment Required. Use this to read, access, or retrieve paywalled content. If the URL is freely accessible, returns the content directly without payment."
triggers = []

[display]
action = "Paying for \"{url}\""

[capabilities]
http = true
x402_pay = true

[call]
args_schema   = '{"url":"<required — full URL of the paywalled or authenticated resource>"}'
output_schema = '{"data":"object","transaction_id":"string","hashscan_url":"string"}'

[call.parameters]
type = "object"

[call.parameters.properties.url]
type = "string"
description = "The full URL of the resource to fetch or pay for. Required — this skill has no default target and will return an error if omitted."

[react]
max_steps = 2