name        = "scrape.web"
version     = "0.1.0"
description = "Fetch and extract text content from a URL. If the URL requires payment (HTTP 402), returns {\"error\":\"payment_required:url=<url>\"} instead of page text — the agent should then call pay.x402 with that URL to unlock the content."
triggers = ["web", "scrape", "http", "https", "url", "localhost", "site", "page"]

[display]
action = "Reading {url}"

[capabilities]
http = true

[call]
args_schema   = '{"url":"string","max_chars":4000}'
output_schema = '{"url":"string","text":"string","chars":"number"}'

[react]
max_steps = 3